[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamflow-server"
version = "0.0.1"
description = "Team Flow 服务端（M0 原型：内存存储，REST + 远程 MCP 两代协议）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=4.0.10,<4.1",
    "mcp>=2.2,<2.3",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["teamflow_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
